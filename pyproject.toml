[project]
name = "python-pronunciation-detection"
version = "0.1.0"
description = "A Python project for detecting pronunciation accuracy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "allosaurus>=1.0.2",
    "openai-whisper",
    "phonemizer>=3.3.0",
    "pyaudio>=0.2.14",
    "whisperx>=3.7.4",
]

[tool.uv.sources]
openai-whisper = { git = "https://github.com/openai/whisper.git" }
