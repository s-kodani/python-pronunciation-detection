[project]
name = "python-pronunciation-detection"
version = "0.1.0"
description = "A Python project for detecting pronunciation accuracy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-whisper",
    "allosaurus>=1.0.2",
    "phonemizer>=3.3.0",
    "pyaudio>=0.2.14",
    "setuptools>=80.9.0,<81",
    "tts>=0.22.0",
    "transformers>=4.21.0,<4.40.0",
    "torch>=2.0.0,<2.6.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "pydub>=0.25.1",
]

[tool.uv.sources]
openai-whisper = { git = "https://github.com/openai/whisper.git" }
